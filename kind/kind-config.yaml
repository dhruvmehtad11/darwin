kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  - containerPort: 6443
    hostPort: 6443
    protocol: TCP
  extraMounts:
  - hostPath: ./kind/shared-storage
    containerPath: /mnt/shared-data
  - hostPath: $HOME/.m2
    containerPath: /mnt/shared-data/.m2
- role: worker
  extraMounts:
  - hostPath: ./kind/shared-storage
    containerPath: /mnt/shared-data
  - hostPath: $HOME/.m2
    containerPath: /mnt/shared-data/.m2
- role: worker
  extraMounts:
  - hostPath: ./kind/shared-storage
    containerPath: /mnt/shared-data
  - hostPath: $HOME/.m2
    containerPath: /mnt/shared-data/.m2
