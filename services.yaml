  - application: darwin-workflow
    base-path: workflow
    path: .
    base-image: darwin/python:3.9.7-pip-bookworm-slim
    env:
      - name: ENV
        value: "darwin-local"
      - name: DEV
        value: "true"
      - name: TEAM_SUFFIX
        value: "-local"
      - name: VPC_SUFFIX
        value: "-local"
      - name: VAULT_SERVICE_MYSQL_USERNAME
        value: "root"
      - name: VAULT_SERVICE_MYSQL_PASSWORD
        value: "password"
      - name: CONFIG_SERVICE_MYSQL_DATABASE
        value: "darwin_workflow"
      - name: VAULT_SERVICE_WORKFLOW_HOST
        value: "darwin-mysql"
      - name: VAULT_SERVICE_WORKFLOW_USERNAME
        value: "root"
      - name: VAULT_SERVICE_WORKFLOW_PASSWORD
        value: "password"
      - name: VAULT_SERVICE_WORKFLOW_DATABASE
        value: "darwin_workflow"
      - name: VAULT_SERVICE_WORKFLOW_PORT
        value: "3306"
      - name: VAULT_SERVICE_ES_USERNAME
        value: "darwin"
      - name: VAULT_SERVICE_ES_PASSWORD
        value: "local-password"
      - name: VAULT_SERVICE_AIRFLOW_TOKEN
        value: "Basic_YWRtaW46YWRtaW5AMTIz"
      - name: AWS_ACCESS_KEY_ID
        value: "minioadmin"
      - name: AWS_SECRET_ACCESS_KEY
        value: "minioadmin"
      - name: AWS_ENDPOINT_URL
        value: "http://darwin-localstack:4566"
      - name: LOG_FILE
        value: "./workflow.log"
      - name: SERVE
        value: "true"
