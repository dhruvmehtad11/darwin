runnerImage:
  image: dreamsports.jfrog.io/d11-docker-artifacts/actions-runner-maven:ubuntu-20.04
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: dsjfrog
labels:
  - self-hosted
  - linux
  - X64
  - kube

resources:
  limits:
    cpu: 32000m
    memory: 64Gi
  requests:
    cpu: 32000m
    memory: 64Gi

autoscaling:
  enabled: true
  minReplicas: 0
  maxReplicas: 20

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::954754807219:role/ci-cluster-service-account-role"
