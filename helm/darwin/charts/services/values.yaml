# Darwin Platform Services
services:
  # Feature Store Service
  feature-store:
    enabled: true
    replicaCount: 1
    serviceName: darwin-ofs-v2
    image:
      registry: localhost:5000
      name: darwin-ofs-v2
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    autoscaling:
      enabled: false

  feature-store-admin:
    enabled: true
    replicaCount: 1
    serviceName: darwin-ofs-v2-admin
    image:
      registry: localhost:5000
      name: darwin-ofs-v2-admin
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    autoscaling:
      enabled: false

  feature-store-consumer:
    enabled: true
    replicaCount: 1
    serviceName: darwin-ofs-v2-consumer
    image:
      registry: localhost:5000
      name: darwin-ofs-v2-consumer
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    autoscaling:
      enabled: false

  # Workspace Service
  workspace:
    enabled: true
    replicaCount: 1
    serviceName: darwin-workspace
    image:
      registry: localhost:5000
      name: darwin-workspace
      tag: latest
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 8000
    ingress:
      enabled: false
    autoscaling:
      enabled: false
    # Volume mounts for persistent storage
    volumeMounts:
      - name: shared-services-data
        mountPath: /var/www/fsx
        subPath: workspace
    # Volumes configuration
    volumes:
      - name: shared-services-data
        persistentVolumeClaim:
          claimName: darwin-shared-pvc

  chronos:
    enabled: true
    replicaCount: 1
    serviceName: chronos
    image:
      registry: localhost:5000
      name: chronos
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8000
    ingress:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /$2
      hosts:
        - host: localhost
          paths:
            - path: /chronos(/|$)(.*)
              pathType: ImplementationSpecific
    autoscaling:
      enabled: false
    extraEnvVars:
      - name: ENV
        value: "local"
      - name: DEPLOYMENT_TYPE
        value: "container"
      - name: AWS_ACCESS_KEY_ID
        value: "test"
      - name: AWS_SECRET_ACCESS_KEY
        value: "test"
      - name: AWS_DEFAULT_REGION
        value: "us-east-1"

  chronos-consumer:
    enabled: true
    replicaCount: 1
    serviceName: chronos-consumer
    image:
      registry: localhost:5000
      name: chronos-consumer
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8000
    ingress:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /$2
      hosts:
        - host: localhost
          paths:
            - path: /chronos-consumer(/|$)(.*)
              pathType: ImplementationSpecific
    autoscaling:
      enabled: false
    extraEnvVars:
      - name: ENV
        value: "local"
      - name: DEPLOYMENT_TYPE
        value: "container"
      - name: AWS_ACCESS_KEY_ID
        value: "test"
      - name: AWS_SECRET_ACCESS_KEY
        value: "test"
      - name: AWS_DEFAULT_REGION
        value: "us-east-1"

  # Workflow Orchestration Service
  workflow:
    enabled: true
    replicaCount: 1
    image:
      repository: darwin-workflow
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8081
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: darwin-workflow.local
          paths:
            - path: /
              pathType: Prefix
    autoscaling:
      enabled: false

  # Compute Orchestration Service
  compute:
    enabled: true
    replicaCount: 1
    serviceName: darwin-compute
    image:
      registry: localhost:5000
      name: darwin-compute
      tag: latest
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 8000
    ingress:
      enabled: false
    autoscaling:
      enabled: false
    extraEnvVars:
      - name: VAULT_SERVICE_MYSQL_USERNAME
        value: "root"
      - name: VAULT_SERVICE_MYSQL_PASSWORD
        value: "password"
      - name: DARWIN_COMPUTE_HOST
        value: "darwin-compute"
      - name: CONFIG_SERVICE_MYSQL_DATABASE
        value: "main"
      - name: VAULT_SERVICE_ES_USERNAME
        value: "admin"
      - name: VAULT_SERVICE_ES_PASSWORD
        value: "admin"
      - name: VAULT_SERVICE_SLACK_TOKEN
        value: "dummy"
      - name: VAULT_SERVICE_SLACK_USERNAME
        value: "darwin-bot"
      - name: OTEL_DISABLED
        value: "true"
      - name: AWS_ACCESS_KEY_ID
        value: "dummy"
      - name: AWS_SECRET_ACCESS_KEY
        value: "dummy"
      - name: AWS_DEFAULT_REGION
        value: "us-east-1"
      - name: AWS_ENDPOINT_URL_S3
        value: "http://darwin-localstack.darwin.svc.cluster.local:4566"

  cluster-manager:
    enabled: true
    replicaCount: 1
    serviceName: darwin-cluster-manager
    image:
      registry: localhost:5000
      name: darwin-cluster-manager
      tag: latest
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    autoscaling:
      enabled: false
    extraEnvVars:
      - name: ARTIFACT_VERSION
        value: "1.0.0"
      - name: AWS_ACCESS_KEY_ID
        value: "dummy"
      - name: AWS_SECRET_ACCESS_KEY
        value: "dummy"
      - name: AWS_DEFAULT_REGION
        value: "us-east-1"
      - name: AWS_ENDPOINT_URL_S3
        value: "http://darwin-localstack:4566"

  mlflow-lib:
    serviceName: darwin-mlflow
    enabled: true
    replicaCount: 1
    image:
      name: darwin-mlflow
      repository: darwin-mlflow
      registry: localhost:5000
      tag: latest
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: darwin-mlflow.local
          paths:
            - path: /
              pathType: Prefix
    autoscaling:
      enabled: false
    extraEnvVars:
      - name: ENV
        value: "darwin-local"
      - name: CONFIG_SERVICE_MYSQL_MASTERHOST
        value: "darwin-mysql"
      - name: CONFIG_SERVICE_MYSQL_DATABASE
        value: "darwin_mlflow"
      - name: VAULT_SERVICE_MYSQL_USERNAME
        value: "darwin"
      - name: VAULT_SERVICE_MYSQL_PASSWORD
        value: "password"
      - name: VAULT_SERVICE_ADMIN_USERNAME
        value: "darwin"
      - name: VAULT_SERVICE_ADMIN_PASSWORD
        value: "password"
      - name: CONFIG_SERVICE_MYSQL_AUTH_DATABASE
        value: "darwin_mlflow_auth"
      - name: MLFLOW_S3_BUCKET
        value: "darwin-mlflow"
      - name: AWS_ACCESS_KEY_ID
        value: "test"
      - name: AWS_SECRET_ACCESS_KEY
        value: "test"
      - name: AWS_DEFAULT_REGION
        value: "us-east-1"

  mlflow-app:
    serviceName: darwin-mlflow-app
    enabled: true
    replicaCount: 1
    image:
      name: darwin-mlflow-app
      repository: darwin-mlflow
      registry: localhost:5000
      tag: latest
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 8000
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: darwin-mlflow-app.local
          paths:
            - path: /
              pathType: Prefix
    autoscaling:
      enabled: false
    extraEnvVars:
      - name: ENV
        value: "darwin-local"
      - name: CONFIG_SERVICE_S3_PATH
        value: "s3://darwin-mlflow-bucket"
      - name: CONFIG_SERVICE_MYSQL_MASTERHOST
        value: "darwin-mysql"
      - name: CONFIG_SERVICE_MYSQL_DATABASE
        value: "darwin_mlflow"
      - name: VAULT_SERVICE_MYSQL_USERNAME
        value: "darwin"
      - name: VAULT_SERVICE_MYSQL_PASSWORD
        value: "password"
      - name: VAULT_SERVICE_ADMIN_USERNAME
        value: "darwin"
      - name: VAULT_SERVICE_ADMIN_PASSWORD
        value: "password"
      - name: VAULT_SERVICE_MLFLOW_ADMIN_USERNAME
        value: "darwin"
      - name: VAULT_SERVICE_MLFLOW_ADMIN_PASSWORD
        value: "password"
      - name: MLFLOW_UI_URL
        value: "http://darwin-mlflow-lib:8080"
      - name: MLFLOW_APP_LAYER_URL
        value: "http://darwin-mlflow-lib:8080"
      - name: MLFLOW_APP_BASE_PATH
        value: ""
      - name: DARWIN_MYSQL_HOST
        value: "darwin-mysql"
      - name: MYSQL_PORT
        value: "3306"
      - name: MLFLOW_S3_BUCKET
        value: "darwin-mlflow"
      - name: AWS_ACCESS_KEY_ID
        value: "test"
      - name: AWS_SECRET_ACCESS_KEY
        value: "test"
      - name: AWS_DEFAULT_REGION
        value: "us-east-1"

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
  host: "localhost"
  # Path-based routing: /service/endpoint -> service:port/endpoint
  paths:
    - path: "/feature-store(/|$)(.*)"
      service: "feature-store"
      port: 8080
    - path: "/feature-store-admin(/|$)(.*)"
      service: "feature-store-admin"
      port: 8080
    - path: "/feature-store-consumer(/|$)(.*)"
      service: "feature-store-consumer"
      port: 8080
    - path: "/workspace(/|$)(.*)"
      service: "workspace"
      port: 8000
    - path: "/mlflow-lib(/|$)(.*)"
      service: "mlflow-lib"
      port: 8080
    - path: "/mlflow-app(/|$)(.*)"
      service: "mlflow-app"
      port: 8000
    - path: "/compute(/|$)(.*)"
      service: "compute"
      port: 8000
    - path: "/cluster-manager(/|$)(.*)"
      service: "cluster-manager"
      port: 8080

# Shared Storage Configuration for Services
# This creates a shared PersistentVolume that can be used by multiple services
storage:
  enabled: true
  storageClassName: shared-services
  size: 5Gi
  reclaimPolicy: Retain
  # For local Kind clusters, uses the .m2 mount which maps to $HOME/.m2 on the host
  hostPath: /mnt/shared-data/efs
