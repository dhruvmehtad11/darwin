# Darwin Platform Services
services:
  # Feature Store Service
  feature-store:
    enabled: false
    replicaCount: 1
    serviceName: darwin-ofs-v2
    image:
      registry: localhost:5000
      name: darwin-ofs-v2
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    autoscaling:
      enabled: false

  feature-store-admin:
    enabled: false
    replicaCount: 1
    serviceName: darwin-ofs-v2-admin
    image:
      registry: localhost:5000
      name: darwin-ofs-v2-admin
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    autoscaling:
      enabled: false

  feature-store-consumer:
    enabled: false
    replicaCount: 1
    serviceName: darwin-ofs-v2-consumer
    image:
      registry: localhost:5000
      name: darwin-ofs-v2-consumer
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    autoscaling:
      enabled: false

  # Workflow Orchestration Service
  workflow:
    enabled: true
    replicaCount: 1
    serviceName: darwin-workflow
    image:
      registry: localhost:5000
      name: darwin-workflow
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8081
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: darwin-workflow.local
          paths:
            - path: /
              pathType: Prefix
    healthcheck:
      path: /healthcheck
      initialDelaySeconds: 60
      readinessDelay: 30
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    autoscaling:
      enabled: false
    extraEnvVars:
      # Elasticsearch Configuration (new from feat/refactor-configs)
      - name: ELASTICSEARCH_URL
        value: "http://{{ $.Release.Name }}-elasticsearch:9200"
      - name: ELASTICSEARCH_USERNAME
        value: ""
      - name: ELASTICSEARCH_PASSWORD
        value: ""
      # Airflow Configuration (new variable names)
      - name: AIRFLOW_URL
        value: "http://{{ $.Release.Name }}-airflow-webserver:8080"
      - name: AIRFLOW_AUTH_TOKEN
        value: "Basic YWRtaW46YWRtaW5AMTIz"
      # Airflow MySQL Configuration (new variable names)
      - name: AIRFLOW_MYSQL_HOST
        value: "{{ $.Release.Name }}-mysql"
      - name: AIRFLOW_MYSQL_USERNAME
        value: "root"
      - name: AIRFLOW_MYSQL_PASSWORD
        value: "{{ $.Values.global.database.mysql.rootPassword }}"
      - name: AIRFLOW_MYSQL_DATABASE
        value: "darwin_workflow"
      - name: AIRFLOW_MYSQL_PORT
        value: "3306"
      # Workflow Database Configuration (new variable names)
      - name: WORKFLOW_DB_HOST
        value: "{{ $.Release.Name }}-mysql"
      - name: WORKFLOW_DB_USERNAME
        value: "root"
      - name: WORKFLOW_DB_PASSWORD
        value: "{{ $.Values.global.database.mysql.rootPassword }}"
      - name: WORKFLOW_DB_NAME
        value: "darwin_workflow"
      - name: WORKFLOW_DB_PORT
        value: "3306"
      # Compute Service (new variable names)
      - name: COMPUTE_SERVICE_URL
        value: "http://{{ $.Release.Name }}-compute:8082"
      - name: COMPUTE_APP_LAYER_URL
        value: "http://{{ $.Release.Name }}-compute:8082/cluster"
      # Commuter (Notebook Viewer)
      - name: COMMUTER_URL
        value: "http://{{ $.Release.Name }}-commuter:8888/view"
      # Application URLs (new variable names)
      - name: WORKFLOW_APP_LAYER_URL
        value: "http://{{ $.Release.Name }}-workflow:8081"
      - name: WORKFLOW_APP_LAYER_PUBLIC_URL
        value: "http://darwin-workflow.local"
      - name: WORKFLOW_UI_BASE_URL
        value: "http://darwin-workflow.local/workflows/"
      # AWS/S3 Configuration (LocalStack)
      - name: AWS_ACCESS_KEY_ID
        value: "minioadmin"
      - name: AWS_SECRET_ACCESS_KEY
        value: "minioadmin"
      - name: AWS_ENDPOINT_URL
        value: "http://darwin-localstack:4566"
      - name: S3_BUCKET_NAME
        value: "darwin-local-bucket"
      - name: AIRFLOW_S3_FOLDER
        value: "darwin_workflow_local/airflow_artifacts"
      # Events and Callbacks (new variable names)
      - name: DEFAULT_CALLBACK_URL
        value: "http://{{ $.Release.Name }}-workflow:8081/events"
      - name: EVENTS_SERVICE_URL
        value: "http://{{ $.Release.Name }}-events:8080"
      # PyPI Configuration (for internal packages)
      - name: PYPI_INDEX_URL
        value: ""
      - name: PYPI_TRUSTED_HOST
        value: ""
      # Other
      - name: LOG_FILE
        value: "./workflow.log"

  # Compute Orchestration Service
  compute:
    enabled: false
    replicaCount: 1
    image:
      repository: darwin-compute
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8082
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: darwin-compute.local
          paths:
            - path: /
              pathType: Prefix
    autoscaling:
      enabled: false

    # Compute Orchestration Service
  mlflow-lib:
    serviceName: darwin-mlflow
    enabled: false
    replicaCount: 1
    image:
      name: darwin-mlflow
      repository: darwin-mlflow
      registry: localhost:5000
      tag: latest
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: darwin-mlflow.local
          paths:
            - path: /
              pathType: Prefix
    autoscaling:
      enabled: false
    extraEnvVars:
      - name: CONFIG_SERVICE_S3_PATH
        value: "s3://darwin-mlflow-bucket"
      - name: CONFIG_SERVICE_MYSQL_MASTERHOST
        value: "localhost" 
      - name: CONFIG_SERVICE_MYSQL_DATABASE
        value: "darwin"
      - name: VAULT_SERVICE_MYSQL_USERNAME
        value: "darwin"
      - name: VAULT_SERVICE_MYSQL_PASSWORD
        value: "password"
      - name: VAULT_SERVICE_ADMIN_USERNAME
        value: "admin"
      - name: VAULT_SERVICE_ADMIN_PASSWORD
        value: "password"
      - name: CONFIG_SERVICE_MYSQL_AUTH_DATABASE
        value: "darwin"

  mlflow-app:
    serviceName: darwin-mlflow-app
    enabled: false
    replicaCount: 1
    image:
      name: darwin-mlflow-app
      repository: darwin-mlflow
      registry: localhost:5000
      tag: latest
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 8000
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: darwin-mlflow-app.local
          paths:
            - path: /
              pathType: Prefix
    autoscaling:
      enabled: false
    extraEnvVars:
      - name: CONFIG_SERVICE_S3_PATH
        value: "s3://darwin-mlflow-bucket"
      - name: CONFIG_SERVICE_MYSQL_MASTERHOST
        value: "localhost"
      - name: CONFIG_SERVICE_MYSQL_DATABASE
        value: "darwin"
      - name: VAULT_SERVICE_MYSQL_USERNAME
        value: "darwin"
      - name: VAULT_SERVICE_MYSQL_PASSWORD
        value: "password"
      - name: VAULT_SERVICE_ADMIN_USERNAME
        value: "admin"
      - name: VAULT_SERVICE_ADMIN_PASSWORD
        value: "password"

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  host: "localhost"
  # Path-based routing: /service/endpoint -> service:port/endpoint
  paths:
    - path: "/feature-store(/|$)(.*)"
      service: "feature-store"
      port: 8080
    - path: "/feature-store-admin(/|$)(.*)"
      service: "feature-store-admin"
      port: 8080
    - path: "/feature-store-consumer(/|$)(.*)"
      service: "feature-store-consumer"
      port: 8080
    - path: "/workflow(/|$)(.*)"
      service: "workflow"
      port: 8081
    - path: "/mlflow-lib(/|$)(.*)"
      service: "mlflow-lib"
      port: 8080
    - path: "/mlflow-app(/|$)(.*)"
      service: "mlflow-app"
      port: 8000
