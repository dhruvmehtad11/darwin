# Darwin Platform Services
services:
  # Feature Store Service
  feature-store:
    enabled: true
    replicaCount: 1
    serviceName: darwin-ofs-v2
    image:
      registry: localhost:5000
      name: darwin-ofs-v2
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    autoscaling:
      enabled: false
              
  feature-store-admin:
    enabled: true
    replicaCount: 1
    serviceName: darwin-ofs-v2-admin
    image:
      registry: localhost:5000
      name: darwin-ofs-v2-admin
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    autoscaling:
      enabled: false

  feature-store-consumer:
    enabled: true
    replicaCount: 1
    serviceName: darwin-ofs-v2-consumer
    image:
      registry: localhost:5000
      name: darwin-ofs-v2-consumer
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    autoscaling:
      enabled: false

  # Workflow Orchestration Service
  workflow:
    enabled: false
    replicaCount: 1
    image:
      repository: darwin-workflow
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8081
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: darwin-workflow.local
          paths:
            - path: /
              pathType: Prefix
    autoscaling:
      enabled: false

  # Compute Orchestration Service  
  compute:
    enabled: true
    replicaCount: 1
    serviceName: darwin-compute
    image:
      registry: localhost:5000
      name: darwin-compute
      tag: latest
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 8000
    ingress:
      enabled: false
    autoscaling:
      enabled: false
    extraEnvVars:
      - name: VAULT_SERVICE_MYSQL_USERNAME
        value: "root"
      - name: VAULT_SERVICE_MYSQL_PASSWORD
        value: "password"
      - name: DARWIN_COMPUTE_HOST
        value: "darwin-compute"
      - name: CONFIG_SERVICE_MYSQL_DATABASE
        value: "main"
      - name: VAULT_SERVICE_ES_USERNAME
        value: "admin"
      - name: VAULT_SERVICE_ES_PASSWORD
        value: "admin"
      - name: VAULT_SERVICE_SLACK_TOKEN
        value: "dummy"
      - name: VAULT_SERVICE_SLACK_USERNAME
        value: "darwin-bot"
      - name: OTEL_DISABLED
        value: "true"
      - name: AWS_ACCESS_KEY_ID
        value: "dummy"
      - name: AWS_SECRET_ACCESS_KEY
        value: "dummy"
      - name: AWS_DEFAULT_REGION
        value: "us-east-1"
      - name: AWS_ENDPOINT_URL_S3
        value: "http://darwin-localstack.darwin.svc.cluster.local:4566"

  cluster-manager:
    enabled: true
    replicaCount: 1
    serviceName: darwin-cluster-manager
    image:
      registry: localhost:5000
      name: darwin-cluster-manager
      tag: latest
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    autoscaling:
      enabled: false
    extraEnvVars:
      - name: ARTIFACT_VERSION
        value: "1.0.0"
      - name: AWS_ACCESS_KEY_ID
        value: "dummy"
      - name: AWS_SECRET_ACCESS_KEY
        value: "dummy"
      - name: AWS_DEFAULT_REGION
        value: "us-east-1"
      - name: AWS_ENDPOINT_URL_S3
        value: "http://darwin-localstack:4566"


# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  host: "localhost"
  # Path-based routing: /service/endpoint -> service:port/endpoint
  paths:
    - path: "/feature-store(/|$)(.*)"
      service: "feature-store"
      port: 8080
    - path: "/feature-store-admin(/|$)(.*)"
      service: "feature-store-admin"
      port: 8080
    - path: "/feature-store-consumer(/|$)(.*)"
      service: "feature-store-consumer"
      port: 8080
    - path: "/compute(/|$)(.*)"
      service: "compute"
      port: 8000
    - path: "/cluster-manager(/|$)(.*)"
      service: "cluster-manager"
      port: 8080
