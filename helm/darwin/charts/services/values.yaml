# Darwin Platform Services
services:
  # Feature Store Service
  feature-store:
    enabled: false
    replicaCount: 1
    serviceName: darwin-ofs-v2
    image:
      registry: localhost:5000
      name: darwin-ofs-v2
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    autoscaling:
      enabled: false

  feature-store-admin:
    enabled: false
    replicaCount: 1
    serviceName: darwin-ofs-v2-admin
    image:
      registry: localhost:5000
      name: darwin-ofs-v2-admin
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    autoscaling:
      enabled: false

  feature-store-consumer:
    enabled: false
    replicaCount: 1
    serviceName: darwin-ofs-v2-consumer
    image:
      registry: localhost:5000
      name: darwin-ofs-v2-consumer
      tag: latest
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    autoscaling:
      enabled: false

  # Workflow Orchestration Service
  workflow:
    enabled: true
    replicaCount: 1
    serviceName: darwin-workflow
    skipInitContainer: true
    image:
      registry: localhost:5000
      name: darwin-workflow
      tag: latest
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 8000
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: darwin-workflow.local
          paths:
            - path: /
              pathType: Prefix
    healthcheck:
      enabled: false
      path: /healthcheck
      initialDelaySeconds: 180
      readinessDelay: 180
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    autoscaling:
      enabled: false
    extraEnvVars:
      # Elasticsearch Configuration (new from feat/refactor-configs)
      - name: ELASTICSEARCH_URL
        value: "http://darwin-elasticsearch:9200"
      - name: ELASTICSEARCH_USERNAME
        value: ""
      - name: ELASTICSEARCH_PASSWORD
        value: ""
      # Airflow Configuration (new variable names)
      - name: AIRFLOW_URL
        value: "http://darwin-airflow:8080/airflow"
      - name: AIRFLOW_AUTH_TOKEN
        value: "Basic ZGFyd2luOmRhcndpbg=="
      # Airflow MySQL Configuration (new variable names)
      - name: AIRFLOW_MYSQL_HOST
        value: "darwin-mysql"
      - name: AIRFLOW_MYSQL_USERNAME
        value: "root"
      - name: AIRFLOW_MYSQL_PASSWORD
        value: "password"
      - name: AIRFLOW_MYSQL_DATABASE
        value: "darwin_workflow"
      - name: AIRFLOW_MYSQL_PORT
        value: "3306"
      # Workflow Database Configuration (new variable names)
      - name: WORKFLOW_DB_HOST
        value: "darwin-mysql"
      - name: WORKFLOW_DB_USERNAME
        value: "root"
      - name: WORKFLOW_DB_PASSWORD
        value: "password"
      - name: WORKFLOW_DB_NAME
        value: "darwin_workflow"
      - name: WORKFLOW_DB_PORT
        value: "3306"
      # Compute Service (new variable names)
      - name: COMPUTE_SERVICE_URL
        value: "http://{{ $.Release.Name }}-compute:8082"
      - name: COMPUTE_APP_LAYER_URL
        value: "http://{{ $.Release.Name }}-compute:8082/cluster"
      # Commuter (Notebook Viewer)
      - name: COMMUTER_URL
        value: "http://{{ $.Release.Name }}-commuter:8888/view"
      # Application URLs (new variable names)
      - name: WORKFLOW_APP_LAYER_URL
        value: "http://darwin-workflow:8000"
      - name: WORKFLOW_APP_LAYER_PUBLIC_URL
        value: "http://darwin-workflow.local"
      - name: WORKFLOW_UI_BASE_URL
        value: "http://darwin-workflow.local/workflows/"
      # AWS/S3 Configuration (LocalStack)
      - name: AWS_ACCESS_KEY_ID
        value: "minioadmin"
      - name: AWS_SECRET_ACCESS_KEY
        value: "minioadmin"
      - name: AWS_ENDPOINT_URL
        value: "http://darwin-localstack:4566"
      - name: AWS_ENDPOINT_OVERRIDE
        value: "http://darwin-localstack:4566"
      - name: S3_BUCKET_NAME
        value: "darwin-local-bucket"
      - name: AIRFLOW_S3_FOLDER
        value: "darwin_workflow_local/airflow_artifacts"
      # Events and Callbacks (new variable names)
      - name: DEFAULT_CALLBACK_URL
        value: "http://{{ $.Release.Name }}-workflow:8000/events"
      - name: EVENTS_SERVICE_URL
        value: "http://{{ $.Release.Name }}-events:8080"
      # PyPI Configuration (for internal packages)
      - name: PYPI_INDEX_URL
        value: ""
      - name: PYPI_TRUSTED_HOST
        value: ""
      # Other
      - name: LOG_FILE
        value: "./workflow.log"
      # Uvicorn worker configuration - use single worker to avoid DB init race conditions
      - name: CORES
        value: "1"
      # Skip Aerich migrations to avoid initialization hang
      - name: SKIP_AERICH_MIGRATIONS
        value: "true"

  # Compute Orchestration Service
  compute:
    enabled: true
    replicaCount: 1
    serviceName: darwin-compute
    image:
      registry: localhost:5000
      name: darwin-compute
      tag: latest
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 8000
    ingress:
      enabled: false
    autoscaling:
      enabled: false
    extraEnvVars:
      - name: VAULT_SERVICE_MYSQL_USERNAME
        value: "root"
      - name: VAULT_SERVICE_MYSQL_PASSWORD
        value: "password"
      - name: DARWIN_COMPUTE_HOST
        value: "darwin-compute"
      - name: CONFIG_SERVICE_MYSQL_DATABASE
        value: "main"
      - name: VAULT_SERVICE_ES_USERNAME
        value: "admin"
      - name: VAULT_SERVICE_ES_PASSWORD
        value: "admin"
      - name: VAULT_SERVICE_SLACK_TOKEN
        value: "dummy"
      - name: VAULT_SERVICE_SLACK_USERNAME
        value: "darwin-bot"
      - name: OTEL_DISABLED
        value: "true"

  cluster-manager:
    enabled: true
    replicaCount: 1
    serviceName: darwin-cluster-manager
    image:
      registry: localhost:5000
      name: darwin-cluster-manager
      tag: latest
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
    autoscaling:
      enabled: false
    extraEnvVars:
      - name: ARTIFACT_VERSION
        value: "1.0.0"
      - name: AWS_ACCESS_KEY_ID
        value: "dummy"
      - name: AWS_SECRET_ACCESS_KEY
        value: "dummy"
      - name: AWS_DEFAULT_REGION
        value: "us-east-1"
      - name: AWS_ENDPOINT_URL_S3
        value: "http://darwin-localstack:4566"


# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  host: "localhost"
  # Path-based routing: /service/endpoint -> service:port/endpoint
  paths:
    - path: "/feature-store(/|$)(.*)"
      service: "feature-store"
      port: 8080
    - path: "/feature-store-admin(/|$)(.*)"
      service: "feature-store-admin"
      port: 8080
    - path: "/feature-store-consumer(/|$)(.*)"
      service: "feature-store-consumer"
      port: 8080
    - path: "/compute(/|$)(.*)"
      service: "compute"
      port: 8000
    - path: "/cluster-manager(/|$)(.*)"
      service: "cluster-manager"
      port: 8080
    - path: "/workflow(/|$)(.*)"
      service: "workflow"
      port: 8000
    - path: "/mlflow-lib(/|$)(.*)"
      service: "mlflow-lib"
      port: 8080
    - path: "/mlflow-app(/|$)(.*)"
      service: "mlflow-app"
      port: 8000
