{{- range $serviceName, $config := .Values.services }}
{{- if $config.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $serviceName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    darwin-component-type: service
    {{- include "darwin.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
spec:
  {{- if not $config.autoscaling.enabled }}
  replicas: {{ $config.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "darwin.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $serviceName }}
  template:
    metadata:
      labels:
        {{- include "darwin.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $serviceName }}
        component-name: {{ $config.serviceName }}
    spec:
      serviceAccountName: {{ $.Release.Name }}-services
      {{- if not $config.skipInitContainer }}
      initContainers:
      - name: wait-for-datastore-health
        image: curlimages/curl:latest
        command: ['sh', '-c']
        args:
          - |
            echo "⏳ Waiting for datastore health check to complete..."
            namespace="{{ $.Values.global.namespace }}"
            job_name="{{ $.Release.Name }}-datastore-health-check"
            
            # Kubernetes API server
            APISERVER=https://kubernetes.default.svc
            TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
            CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            
            max_attempts=60
            attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              # Check job status via Kubernetes API
              response=$(curl -s --cacert $CACERT --header "Authorization: Bearer $TOKEN" \
                "$APISERVER/apis/batch/v1/namespaces/$namespace/jobs/$job_name" 2>/dev/null)
              
              # Debug: Show what we got (first attempt only)
              if [ $attempt -eq 1 ]; then
                echo "🔍 Debug: API response excerpt: $(echo "$response" | head -c 200)..."
              fi
              
              # Check if job exists (allow for spaces in JSON formatting)
              if ! echo "$response" | grep -qE '"kind"\s*:\s*"Job"'; then
                echo "⏳ Waiting for health check job to start... (attempt $attempt/$max_attempts)"
                sleep 5
                attempt=$((attempt + 1))
                continue
              fi
              
              # Check job status (allow for spaces in JSON formatting)
              if echo "$response" | grep -qE '"succeeded"\s*:\s*1'; then
                echo "✅ Datastore health check completed - proceeding with {{ $serviceName }} service"
                exit 0
              elif echo "$response" | grep -qE '"failed"\s*:\s*[1-9]'; then
                echo "❌ Datastore health check failed - cannot start {{ $serviceName }} service"
                # Show job logs for debugging
                echo "📋 Fetching health check job logs for debugging..."
                kubectl logs -n "$namespace" -l app.kubernetes.io/component=datastore-health-check --tail=50 || true
                exit 1
              else
                # Job exists but not completed yet
                active=$(echo "$response" | grep -o '"active": *[0-9]*' | grep -o '[0-9]*' || echo "0")
                succeeded=$(echo "$response" | grep -o '"succeeded": *[0-9]*' | grep -o '[0-9]*' || echo "0")
                failed=$(echo "$response" | grep -o '"failed": *[0-9]*' | grep -o '[0-9]*' || echo "0")
                echo "⏳ Health check still running... (active: $active, succeeded: $succeeded, failed: $failed) (attempt $attempt/$max_attempts)"
              fi
              
              sleep 5
              attempt=$((attempt + 1))
            done
            
            echo "❌ Timeout waiting for datastore health check"
            exit 1
      {{- end }}
      containers:
        - name: {{ $serviceName }}
          image: "{{ $config.image.registry }}/{{ $config.image.name }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $config.service.port }}
              protocol: TCP
          env:
            # Common environment variables
            - name: TEAM_SUFFIX
              value: "-darwin-local"
            - name: VPC_SUFFIX
              value: "-darwin-local"
            - name: ENV
              value: "darwin-local"
            - name: APP_DIR
              value: "/app"
            - name: DEPLOYMENT_TYPE
              value: "container"
            - name: SERVICE_NAME
              value: "{{ $config.serviceName }}"
            # Database connections
            - name: DARWIN_MYSQL_HOST
              value: "{{ $.Release.Name }}-mysql"
            - name: DARWIN_MYSQL_USERNAME
              value: "root"
            - name: DARWIN_MYSQL_PASSWORD
              value: "{{ $.Values.global.database.mysql.rootPassword }}"
            - name: DARWIN_CASSANDRA_HOST
              value: "{{ $.Release.Name }}-cassandra"
            - name: DARWIN_KAFKA_HOST
              value: "{{ $.Release.Name }}-kafka"
            # Feature Store Service URLs
            - name: DARWIN_FEATURE_STORE_ADMIN_HOST
              value: "{{ $.Release.Name }}-feature-store-admin"
            - name: DARWIN_FEATURE_STORE_HOST
              value: "{{ $.Release.Name }}-feature-store"
            - name: DARWIN_ZOOKEEPER_HOST
              value: "{{ $.Release.Name }}-zookeeper"
            - name: AWS_ENDPOINT_OVERRIDE
              value: "http://{{ $.Release.Name }}-localstack:4566"
            {{- if $config.extraEnvVars }}
            {{- toYaml $config.extraEnvVars | nindent 12 }}
            {{- end }}
          {{- if $config.volumeMounts }}
          volumeMounts:
            {{- range $config.volumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- if .readOnly }}
              readOnly: {{ .readOnly }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if $config.healthcheck }}
          livenessProbe:
            httpGet:
              path: {{ $config.healthcheck.path }}
              port: http
            initialDelaySeconds: {{ $config.healthcheck.initialDelaySeconds | default 60 }}
            periodSeconds: 30
            timeoutSeconds: {{ $config.healthcheck.timeoutSeconds | default 10 }}
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ $config.healthcheck.path }}
              port: http
            initialDelaySeconds: {{ $config.healthcheck.readinessDelay | default 30 }}
            periodSeconds: 10
            timeoutSeconds: {{ $config.healthcheck.readinessTimeoutSeconds | default $config.healthcheck.timeoutSeconds | default 5 }}
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
      {{- if $config.volumes }}
      volumes:
        {{- range $config.volumes }}
        - name: {{ .name }}
          {{- if .persistentVolumeClaim }}
          persistentVolumeClaim:
            claimName: {{ .persistentVolumeClaim.claimName }}
          {{- else if .hostPath }}
          hostPath:
            path: {{ .hostPath.path }}
            type: {{ .hostPath.type | default "DirectoryOrCreate" }}
          {{- else if .emptyDir }}
          emptyDir: {}
          {{- else if .configMap }}
          configMap:
            name: {{ .configMap.name }}
          {{- end }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $serviceName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    darwin-component-type: service
    {{- include "darwin.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
    component-name: {{ $config.serviceName }}
spec:
  type: {{ $config.service.type }}
  ports:
    - port: {{ $config.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "darwin.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
{{- if $config.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-{{ $serviceName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "darwin.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  {{- with $config.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $config.ingress.className }}
  ingressClassName: {{ $config.ingress.className }}
  {{- end }}
  rules:
    {{- range $config.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Release.Name }}-{{ $serviceName }}
                port:
                  number: {{ $config.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- if $config.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $.Release.Name }}-{{ $serviceName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "darwin.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $.Release.Name }}-{{ $serviceName }}
  minReplicas: {{ $config.autoscaling.minReplicas }}
  maxReplicas: {{ $config.autoscaling.maxReplicas }}
  metrics:
    {{- if $config.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $config.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
