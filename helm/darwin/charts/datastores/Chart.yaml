apiVersion: v2
name: datastores
description: Darwin Platform Datastores - Database and messaging infrastructure
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  # Disabled: Using parent chart templates instead to avoid label conflicts
  # - name: mysql
  #   version: 1.0.0
  #   repository: "file://./mysql"
  #   condition: mysql.enabled
  - name: elasticsearch
    version: 1.0.0
    repository: "file://./elasticsearch"
    condition: elasticsearch.enabled
    tags:
      - search
  - name: cassandra
    version: 1.0.0
    repository: "file://./cassandra"
    condition: cassandra.enabled
  - name: zookeeper
    version: 1.0.0
    repository: "file://./zookeeper"
    condition: zookeeper.enabled
  - name: kafka
    version: 1.0.0
    repository: "file://./kafka"
    condition: kafka.enabled
    tags:
      - messaging
  - name: airflow
    version: 1.0.0
    repository: "file://./airflow"
    condition: airflow.enabled
    tags:
      - workflow
