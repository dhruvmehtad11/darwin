            type: Directory
        - name: darwin-compute-core-source
          hostPath:
            path: /tmp/workflow/darwin-compute-core
            type: Directory
        {{- end }}
        - name: python-packages
          emptyDir: {}
        {{- $env := .Values.global.environment | default "stag" }}
        {{- if or (eq $env "local") (eq $env "darwin-local") }}
        - name: sync-script
          configMap:
            name: {{ .Release.Name }}-airflow-sync-script
        {{- end }}
---
{{- if .Values.airflow.workers.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-airflow-worker
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "darwin.labels" . | nindent 4 }}
    app.kubernetes.io/component: airflow-worker
spec:
  replicas: {{ .Values.airflow.workers.replicas | default 2 }}
  selector:
    matchLabels:
      {{- include "darwin.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: airflow-worker
  template:
    metadata:
      labels:
        {{- include "darwin.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: airflow-worker
    spec:
      initContainers:
        - name: setup-operators
          image: {{ include "darwin.image" (dict "image" "busybox:latest" "context" .) }}
          command: ['sh', '-c', 'mkdir -p /opt/airflow/plugins/operators && cp /tmp/operators/*.py /opt/airflow/plugins/operators/']
          volumeMounts:
            - name: airflow-operators
              mountPath: /tmp/operators
            - name: airflow-plugins
              mountPath: /opt/airflow/plugins
        - name: install-airflow-core
          image: "{{ .Values.airflow.image.repository }}:{{ .Values.airflow.image.tag }}"
          imagePullPolicy: {{ .Values.airflow.image.pullPolicy | default "IfNotPresent" }}
          command: ['sh', '-c', 'mkdir -p /opt/airflow/custom-packages && if [ -f ~/.pip/pip.conf ]; then sed -i "s/user = true/user = false/" ~/.pip/pip.conf 2>/dev/null || true; fi && if [ -f /etc/pip.conf ]; then sed -i "s/user = true/user = false/" /etc/pip.conf 2>/dev/null || true; fi && export PIP_USER=false && {{ if and .Values.airflow.airflowCore .Values.airflow.airflowCore.gitRepo }}apt-get update && apt-get install -y git && pip install --target /opt/airflow/custom-packages pydantic==1.10.8 && pip install --target /opt/airflow/custom-packages airflow_core@git+https://{{ .Values.airflow.airflowCore.gitToken }}@github.com/{{ .Values.airflow.airflowCore.gitRepo }}@{{ .Values.airflow.airflowCore.gitBranch | default "main" }}#subdirectory=airflow --force-reinstall --upgrade && touch /opt/airflow/custom-packages/__init__.py{{ else }}grep -v -E "(compute_sdk|darwin-compute)" /tmp/airflow-source/requirements.txt > /tmp/requirements-filtered.txt && pip install --target /opt/airflow/custom-packages -r /tmp/requirements-filtered.txt && cp -r /tmp/airflow-source/src/airflow_core /opt/airflow/custom-packages/ && cp -r /tmp/commons-source /opt/airflow/custom-packages/commons && cp -r /tmp/darwin-compute-sdk-source/src/darwin_compute /opt/airflow/custom-packages/ && cp -r /tmp/darwin-compute-model-source/src/compute_model /opt/airflow/custom-packages/ && cp -r /tmp/darwin-compute-core-source/src/compute_core /opt/airflow/custom-packages/ && touch /opt/airflow/custom-packages/__init__.py{{ end }}']
          volumeMounts:
            {{- if not (and .Values.airflow.airflowCore .Values.airflow.airflowCore.gitRepo) }}
            - name: airflow-source
              mountPath: /tmp/airflow-source
              readOnly: true
            - name: commons-source
              mountPath: /tmp/commons-source
              readOnly: true
            - name: darwin-compute-sdk-source
              mountPath: /tmp/darwin-compute-sdk-source
              readOnly: true
            - name: darwin-compute-model-source
              mountPath: /tmp/darwin-compute-model-source
              readOnly: true
            - name: darwin-compute-core-source
              mountPath: /tmp/darwin-compute-core-source
              readOnly: true
            {{- end }}
            - name: python-packages
              mountPath: /opt/airflow/custom-packages
      containers:
        - name: airflow-worker
          image: "{{ .Values.airflow.image.repository }}:{{ .Values.airflow.image.tag }}"
          imagePullPolicy: {{ .Values.airflow.image.pullPolicy | default "IfNotPresent" }}
          command: ['airflow', 'celery', 'worker']
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "mysql://root:{{ .Values.global.database.mysql.rootPassword }}@{{ .Release.Name }}-mysql:3306/airflow"
            - name: AIRFLOW__CORE__EXECUTOR
              value: "{{ .Values.airflow.executor }}"
            - name: AIRFLOW__CELERY__BROKER_URL
              value: "pyamqp://{{ .Values.airflow.rabbitmq.auth.username }}:{{ .Values.airflow.rabbitmq.auth.password }}@{{ .Release.Name }}-airflow-rabbitmq:5672//"
            - name: AIRFLOW__CELERY__RESULT_BACKEND
              value: "rpc://"
            - name: AIRFLOW__CORE__FERNET_KEY
              value: "81HqDtbqAywKSOumSKKJ6HJJXBRw7LwVwF4XLrwLqsI="
            - name: AIRFLOW__CORE__DAGS_FOLDER
              value: "/opt/airflow/dags"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: PYTHONPATH
              value: "/opt/airflow/custom-packages:${PYTHONPATH}"
          volumeMounts:
            - name: airflow-plugins
              mountPath: /opt/airflow/plugins
            - name: python-packages
              mountPath: /opt/airflow/custom-packages
          resources:
            {{- toYaml .Values.airflow.workers.resources | nindent 12 }}
      volumes:
        - name: airflow-operators
          configMap:
            name: airflow-operators
        - name: airflow-plugins
          emptyDir: {}
        {{- if not (and .Values.airflow.airflowCore .Values.airflow.airflowCore.gitRepo) }}
        - name: airflow-source
          hostPath:
            path: {{ if and .Values.airflow.airflowCore .Values.airflow.airflowCore.sourcePath }}{{ .Values.airflow.airflowCore.sourcePath }}{{ else }}/tmp/workflow/airflow{{ end }}
            type: Directory
        - name: commons-source
          hostPath:
            path: /tmp/workflow/commons
            type: Directory
        - name: darwin-compute-sdk-source
          hostPath:
            path: /tmp/workflow/darwin-compute-sdk
            type: Directory
        - name: darwin-compute-model-source
          hostPath:
            path: /tmp/workflow/darwin-compute-model
            type: Directory
        - name: darwin-compute-core-source
          hostPath:
            path: /tmp/workflow/darwin-compute-core
            type: Directory
        {{- end }}
        - name: python-packages
          emptyDir: {}
{{- end }}
{{- end }}
