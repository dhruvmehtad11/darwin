{{- if .Values.cassandra.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "darwin.fullname" . }}-cassandra
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "darwin.labels" . | nindent 4 }}
    app.kubernetes.io/component: cassandra
spec:
  serviceName: {{ include "darwin.fullname" . }}-cassandra-headless
  replicas: {{ .Values.cassandra.cluster.replicaCount }}
  selector:
    matchLabels:
      {{- include "darwin.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cassandra
  template:
    metadata:
      labels:
        {{- include "darwin.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cassandra
    spec:
      containers:
        - name: cassandra
          image: cassandra:5.0
          env:
            - name: MAX_HEAP_SIZE
              value: "2G"
            - name: HEAP_NEWSIZE
              value: "512M"
            - name: CASSANDRA_CLUSTER_NAME
              value: {{ .Values.cassandra.cluster.name | quote }}
            - name: CASSANDRA_DC
              value: "datacenter1"
            - name: CASSANDRA_RACK
              value: "rack1"
            - name: CASSANDRA_SEEDS
              value: "{{ include "darwin.fullname" . }}-cassandra-0.{{ include "darwin.fullname" . }}-cassandra-headless.{{ .Values.global.namespace }}.svc.cluster.local"
          ports:
            - name: intra-node
              containerPort: 7000
            - name: tls-intra-node
              containerPort: 7001
            - name: jmx
              containerPort: 7199
            - name: cql
              containerPort: 9042
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - nodetool status
            initialDelaySeconds: 90
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - nodetool status | grep UN
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            {{- toYaml .Values.cassandra.resources | nindent 12 }}
          {{- if .Values.cassandra.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/cassandra
          {{- end }}
  {{- if .Values.cassandra.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.cassandra.persistence.size }}
  {{- end }}
{{- end }}
