{{- range $serviceName, $config := .Values.services }}
{{- if $config.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "darwin.fullname" $ }}-{{ $serviceName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "darwin.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
spec:
  {{- if not $config.autoscaling.enabled }}
  replicas: {{ $config.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "darwin.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $serviceName }}
  template:
    metadata:
      labels:
        {{- include "darwin.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $serviceName }}
    spec:
      containers:
        - name: {{ $serviceName }}
          image: "{{ $config.image.registry }}/{{ $config.image.name }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $config.service.port }}
              protocol: TCP
          env:
            # Common environment variables
            - name: TEAM_SUFFIX
              value: "-darwin-local"
            - name: VPC_SUFFIX
              value: "-darwin-local"
            - name: ENV
              value: "darwin-local"
            - name: APP_DIR
              value: "/app"
            - name: DEPLOYMENT_TYPE
              value: "container"
            - name: SERVICE_NAME
              value: "{{ $config.serviceName }}"
            # Database connections
            - name: DARWIN_MYSQL_HOST
              value: "{{ include "darwin.fullname" $ }}-mysql"
            - name: DARWIN_MYSQL_USERNAME
              value: "root"
            - name: DARWIN_MYSQL_PASSWORD
              value: "{{ $.Values.mysql.auth.rootPassword }}"
            - name: DARWIN_CASSANDRA_HOST
              value: "{{ include "darwin.fullname" $ }}-cassandra"
            - name: DARWIN_KAFKA_HOST
              value: "{{ include "darwin.fullname" $ }}-kafka"
            # Feature Store Service URLs
            - name: DARWIN_FEATURE_STORE_ADMIN_HOST
              value: "{{ include "darwin.fullname" $ }}-feature-store-admin"
            - name: DARWIN_FEATURE_STORE_HOST
              value: "{{ include "darwin.fullname" $ }}-feature-store"
            - name: DARWIN_ZOOKEEPER_HOST
              value: "{{ include "darwin.fullname" $ }}-zookeeper"
            {{- if $config.extraEnvVars }}
            {{- toYaml $config.extraEnvVars | nindent 12 }}
            {{- end }}
          {{- if $config.healthcheck }}
          livenessProbe:
            httpGet:
              path: {{ $config.healthcheck.path }}
              port: http
            initialDelaySeconds: {{ $config.healthcheck.initialDelaySeconds | default 60 }}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ $config.healthcheck.path }}
              port: http
            initialDelaySeconds: {{ $config.healthcheck.readinessDelay | default 30 }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "darwin.fullname" $ }}-{{ $serviceName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "darwin.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
spec:
  type: {{ $config.service.type }}
  ports:
    - port: {{ $config.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "darwin.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
{{- if $config.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "darwin.fullname" $ }}-{{ $serviceName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "darwin.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  {{- with $config.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $config.ingress.className }}
  ingressClassName: {{ $config.ingress.className }}
  {{- end }}
  rules:
    {{- range $config.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "darwin.fullname" $ }}-{{ $serviceName }}
                port:
                  number: {{ $config.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- if $config.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "darwin.fullname" $ }}-{{ $serviceName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "darwin.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "darwin.fullname" $ }}-{{ $serviceName }}
  minReplicas: {{ $config.autoscaling.minReplicas }}
  maxReplicas: {{ $config.autoscaling.maxReplicas }}
  metrics:
    {{- if $config.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $config.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
