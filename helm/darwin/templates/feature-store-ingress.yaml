{{- if and .Values.darwinFeatureStore.enabled .Values.darwinFeatureStore.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "darwin.fullname" . }}-feature-store
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "darwin.labels" . | nindent 4 }}
    app.kubernetes.io/component: feature-store
  {{- with .Values.darwinFeatureStore.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.darwinFeatureStore.ingress.className }}
  ingressClassName: {{ .Values.darwinFeatureStore.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.darwinFeatureStore.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "darwin.fullname" $ }}-feature-store
                port:
                  number: {{ $.Values.darwinFeatureStore.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
