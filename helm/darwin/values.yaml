# Global configuration
global:
  imageRegistry: docker.io
  storageClass: standard
  namespace: darwin
  # Use local Kind storage (hostPath) vs real K8s storage (PVCs)
  local-k8s: true
  # Environment: local, darwin-local, dev, stag, uat, prod
  environment: darwin-local
  
  # Database connection details (shared across subcharts)
  database:
    mysql:
      username: "darwin"
      rootPassword: "password"
      database: "darwin"
      userPassword: "password"
    cassandra:
      username: "darwin_user"
      password: "darwin_password"

# Subchart Configuration
datastores:
  enabled: true
  # Only enable datastores required for darwin-workflow
  mysql:
    enabled: true
  elasticsearch:
    enabled: true
  localstack:
    enabled: true
  airflow:
    enabled: true
  # Disable unnecessary datastores
  cassandra:
    enabled: false
  kafka:
    enabled: false
  zookeeper:
    enabled: false

services:
  enabled: true
  # Only darwin-workflow service is enabled
  # See charts/services/values.yaml for service-specific configuration

# Monitoring and Observability - DISABLED for minimal darwin-workflow setup
monitoring:
  enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false
    admin:
      user: admin
      password: admin123

# Development Environment Settings
development:
  enabled: false
  debug: false
  hotReload: false

# Production Environment Settings
production:
  enabled: false
  security:
    networkPolicies: true
    podSecurityStandards: true
