# Global configuration
global:
  imageRegistry: docker.io
  storageClass: standard
  namespace: darwin
  # Use local Kind storage (hostPath) vs real K8s storage (PVCs)
  local-k8s: true

  # Database connection details (shared across subcharts)
  database:
    mysql:
      username: "darwin"
      rootPassword: "password"
      database: "darwin"
      userPassword: "password"
    cassandra:
      username: "darwin_user"
      password: "darwin_password"

# Subchart Configuration
datastores:
  enabled: true
  localstack:
    enabled: false
  airflow:
    enabled: false

services:
  enabled: true
  # Ingress provides centralized routing at localhost
  # Routes: /feature-store, /feature-store-admin, /feature-store-consumer

# Monitoring and Observability
monitoring:
  enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: true
    admin:
      user: admin
      password: admin123

# Development Environment Settings
development:
  enabled: false
  debug: false
  hotReload: false

# Production Environment Settings
production:
  enabled: false
  security:
    networkPolicies: true
    podSecurityStandards: true

# Ingress Controller Configuration
# Managed via Helm for consistent lifecycle management
ingress-nginx:
  enabled: true

  # Configure controller to NOT create a new IngressClass (reuse existing if present)
  controller:
    ingressClassResource:
      # This 'name' must match the existing class or will be created if needed
      name: nginx
      # This tells the controller which class to manage
      controllerValue: "k8s.io/ingress-nginx"
      # Allow creation if it doesn't exist
      create: true

    # This tells the controller which IngressClass to watch
    ingressClass: nginx

    # Configure for Kind clusters - use hostNetwork for direct port 80/443 exposure
    # This allows localhost:80 to reach the ingress controller
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet

    # Service configuration (NodePort used with hostNetwork for Kind)
    service:
      type: NodePort
      nodePorts:
        http: 80
        https: 443
      external:
        enabled: false

    # Pod security context
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      fsGroup: 101

    # Additional Kind-optimized settings
    extraArgs:
      update-status: "true"
      publish-status-address: "localhost"

    # Node selector to ensure ingress runs on control plane (where Kind maps ports)
    nodeSelector:
      ingress-ready: "true"

    # Tolerations to allow scheduling on control plane nodes
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Equal
        value: ""
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Equal
        value: ""
