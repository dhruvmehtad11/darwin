# Global configuration
global:
  imageRegistry: docker.io
  storageClass: standard
  namespace: darwin
  
  # Database connection details (shared across subcharts)
  database:
    mysql:
      username: "darwin"
      rootPassword: "password"
      database: "darwin"
      userPassword: "password"
    cassandra:
      username: "darwin_user"
      password: "darwin_password"

# Subchart Configuration
datastores:
  enabled: true

services:
  enabled: true

# Monitoring and Observability
monitoring:
  enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: true
    admin:
      user: admin
      password: admin123

# Development Environment Settings
development:
  enabled: false
  debug: false
  hotReload: false

# Production Environment Settings
production:
  enabled: false
  security:
    networkPolicies: true
    podSecurityStandards: true
